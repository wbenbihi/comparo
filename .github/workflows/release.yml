name: Release

# Semantic release derives versions from Conventional Commits on the release branches. The
# repository-scoped token creates the version commit, tag, and GitHub release; PyPI publishing is
# isolated in a second least-privilege job and uses Trusted Publishing (OIDC). Protected release
# branches must explicitly permit this workflow instead of relying on an administrator PAT bypass.
on:
  push:
    branches: [main, alpha, beta, rc]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Comparo tag to rebuild, verify, and resume publishing
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      released: ${{ steps.plan.outputs.released }}
    if: github.repository_owner == 'wbenbihi'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Pin checkout to the triggering commit
        if: inputs.release_tag == ''
        run: git reset --hard "${{ github.sha }}"

      - name: Validate recovery tag
        if: inputs.release_tag != ''
        env:
          RECOVERY_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RECOVERY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release_tag must be a Comparo semantic-version tag" >&2
            exit 1
          fi
          release_commit="$(git rev-parse --verify "refs/tags/${RECOVERY_TAG}^{commit}")"
          git merge-base --is-ancestor "$release_commit" "origin/${GITHUB_REF_NAME}"
          git checkout --detach "$release_commit"
          test "$(git rev-parse HEAD)" = "$release_commit"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"
          version: "0.11.21"

      - name: Verify reviewed source
        run: |
          uv sync --frozen
          uv lock --check
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy
          uv run --frozen lint-imports
          uv run --frozen python -m pytest --cov --cov-report=term-missing

      - name: Plan semantic release
        id: plan
        env:
          RECOVERY_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RECOVERY_TAG" ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "recovery=true" >> "$GITHUB_OUTPUT"
            echo "tag=$RECOVERY_TAG" >> "$GITHUB_OUTPUT"
          else
            next_version="$(uv run --frozen semantic-release version --print)"
            last_version="$(uv run --frozen semantic-release version --print-last-released)"
            if [[ "$next_version" == "$last_version" ]]; then
              echo "released=false" >> "$GITHUB_OUTPUT"
              echo "recovery=false" >> "$GITHUB_OUTPUT"
            else
              echo "released=true" >> "$GITHUB_OUTPUT"
              echo "recovery=false" >> "$GITHUB_OUTPUT"
              echo "tag=$(uv run --frozen semantic-release version --print-tag)" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Stage version, changelog, tag, and distributions locally
        if: steps.plan.outputs.released == 'true' && steps.plan.outputs.recovery != 'true'
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          uv run --frozen semantic-release version --no-push --no-vcs-release

      - name: Rebuild recovery distributions
        if: steps.plan.outputs.recovery == 'true'
        run: uv build

      - name: Verify release version identity
        if: steps.plan.outputs.released == 'true'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          project_version="$(uv run --no-sync python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$project_version" = "${RELEASE_TAG#v}"

      - name: Verify released distribution members
        if: steps.plan.outputs.released == 'true'
        run: >-
          uv run --no-sync python -m tests.architecture.distribution_members
          dist/comparo-*.tar.gz dist/comparo-*.whl

      - name: Verify released distribution integrity
        if: steps.plan.outputs.released == 'true'
        run: |
          gzip --test dist/comparo-*.tar.gz
          unzip -t dist/comparo-*.whl

      - name: Smoke test installed release wheel
        if: steps.plan.outputs.released == 'true'
        run: |
          uv venv --python 3.13 .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/comparo-*.whl
          .wheel-smoke/bin/comparo --help
          .wheel-smoke/bin/comparo schema config > /dev/null
          .wheel-smoke/bin/comparo doctor --format json

      - name: Publish verified commit and tag atomically
        if: steps.plan.outputs.released == 'true' && steps.plan.outputs.recovery != 'true'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: >-
          git push --atomic origin
          "HEAD:refs/heads/${GITHUB_REF_NAME}"
          "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: Create or repair the verified GitHub release
        if: steps.plan.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/comparo-*.tar.gz dist/comparo-*.whl --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/comparo-*.tar.gz dist/comparo-*.whl \
              --verify-tag --generate-notes "${release_flags[@]}"
          fi

      - name: Preserve verified distributions
        if: steps.plan.outputs.released == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: dist
          skip-existing: true
