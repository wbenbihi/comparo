name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"
          version: "0.11.21"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Verify dependency lock
        run: uv lock --check

      - name: Lint (ruff)
        run: uv run --frozen ruff check .

      - name: Format check (ruff)
        run: uv run --frozen ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run --frozen mypy

      - name: Architecture contract (import-linter)
        run: uv run --frozen lint-imports

      - name: Tests
        run: uv run --frozen python -m pytest --cov --cov-report=term-missing

      - name: Build distributions
        run: uv build

      - name: Verify distribution members
        run: >-
          uv run --frozen python -m tests.architecture.distribution_members
          dist/comparo-*.tar.gz dist/comparo-*.whl

      - name: Verify distribution integrity
        run: |
          gzip --test dist/comparo-*.tar.gz
          unzip -t dist/comparo-*.whl

      - name: Smoke test installed wheel
        run: |
          uv venv --python 3.13 .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/comparo-*.whl
          .wheel-smoke/bin/comparo --help
          .wheel-smoke/bin/comparo schema config > /dev/null
          .wheel-smoke/bin/comparo doctor --format json

  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.11.21"

      - name: Run compatibility tests
        run: uv run --frozen python -m pytest
