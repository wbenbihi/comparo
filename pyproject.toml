[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "comparo"
version = "0.2.0"
description = "Typed core domain contracts for HTTP regression and diff testing across environments."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Walid Benbihi", email = "waligoo@gmail.com" }]
keywords = ["http", "api", "testing", "regression", "diff", "tui", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "httpcore[asyncio,http2]>=1.0.9,<2",
  "msgspec>=0.21.1,<1",
  "pyyaml>=6.0.3,<7",
]

[project.urls]
Homepage = "https://github.com/wbenbihi/comparo"
Repository = "https://github.com/wbenbihi/comparo"
Issues = "https://github.com/wbenbihi/comparo/issues"

[dependency-groups]
dev = [
  "hatchling==1.27.0",
  "hypothesis>=6.135.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "import-linter>=2.1.0",
  "pre-commit>=4.0.0",
  "python-semantic-release==10.6.1",
  "types-pyyaml>=6.0.12.20250516",
]

[tool.hatch.build]
# Defense in depth for both wheels and source distributions. VCS ignore rules remove known local
# state; release verification compares concrete archive members with the reviewed Git index.
ignore-vcs = false
exclude = [
  "/**/__pycache__",
  "/**/*.py[cod]",
  "/**/.env*",
  "/**/*.pem",
  "/**/*.key",
  "/**/*.p12",
  "/**/*.pfx",
  "/**/*.credentials",
  "/**/*-secret.*",
  "/**/.claude/**",
  "/**/.codex/**",
  "/**/.agents/**",
  "/**/.hypothesis/**",
  "/**/.pytest_cache/**",
  "/**/.mypy_cache/**",
  "/**/.ruff_cache/**",
  "/**/.coverage*",
  "/**/htmlcov/**",
  "/**/reports/**",
  "/**/.reports/**",
  "/**/runs/**",
  "/**/internal*/**",
  "/**/*deprecated*/**",
  "/**/*.ignore.*",
  "/**/*.deprecated.*",
  "/.gitignore",
]

[tool.hatch.build.targets.wheel]
packages = ["src/comparo"]

[tool.hatch.build.targets.sdist]
# The sdist is an installation artifact, not a repository snapshot. Tests, working documentation,
# editor state, agent state, and deprecated sources are deliberately absent.
include = [
  "/src/comparo",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

# ── Lint & format ───────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "BLE", # flake8-blind-except
  "C90", # mccabe complexity
  "C4",  # flake8-comprehensions
  "DTZ", # flake8-datetimez
  "G",   # flake8-logging-format
  "LOG", # flake8-logging
  "PERF",# perflint
  "PIE", # flake8-pie
  "RET", # flake8-return
  "S",   # flake8-bandit
  "SIM", # flake8-simplify
  "T20", # flake8-print
  "PTH", # flake8-use-pathlib
  "TID", # flake8-tidy-imports
  "RUF", # ruff-specific
  "D",   # pydocstyle — enforce presence + Google style (no missing docstrings)
  "ANN401", # prohibit dynamically typed Any parameters
  "PT",  # flake8-pytest-style — functional-test hygiene
]

[tool.ruff.lint.isort]
force-single-line = true            # one import per line
known-first-party = ["comparo"]     # sections: stdlib, third-party, first-party

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test functions and fakes are self-describing; require module docstrings only.
"tests/*" = ["S101", "S105", "S106", "S107", "D102", "D103", "D107"]

[tool.ruff.format]
docstring-code-format = true

# ── Types ───────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
extra_checks = true
enable_error_code = [
  "explicit-override",
  "ignore-without-code",
  "mutable-override",
  "possibly-undefined",
]
files = ["src", "tests"]

# ── Tests ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["comparo"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

# ── Architecture guards ───────────────────────────────────────────────
[tool.importlinter]
root_package = "comparo"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The domain must not import adapter frameworks"
type = "forbidden"
source_modules = ["comparo.core.domain"]
forbidden_modules = [
  "aiohttp",
  "httpcore",
  "httpx",
  "jsonschema",
  "requests",
  "ruamel",
  "textual",
  "typer",
  "urllib3",
]

[[tool.importlinter.contracts]]
name = "Evaluation engines must remain independently replaceable"
type = "independence"
modules = [
  "comparo.core.assertions",
  "comparo.core.diffs",
  "comparo.core.gates",
]

[[tool.importlinter.contracts]]
name = "Pure evaluation engines must not import adapter frameworks"
type = "forbidden"
source_modules = [
  "comparo.core.assertions",
  "comparo.core.diffs",
  "comparo.core.evaluation",
  "comparo.core.gates",
]
forbidden_modules = [
  "aiohttp",
  "httpcore",
  "httpx",
  "jsonschema",
  "requests",
  "ruamel",
  "textual",
  "typer",
  "urllib3",
]

[[tool.importlinter.contracts]]
name = "The core configuration compiler must not import document or filesystem adapters"
type = "forbidden"
source_modules = ["comparo.core.configuration"]
forbidden_modules = [
  "comparo.configuration",
  "pathlib",
  "yaml",
  "aiohttp",
  "httpx",
  "requests",
  "urllib3",
]

[[tool.importlinter.contracts]]
name = "Version frontends must remain independent of canonical compiler stages"
type = "forbidden"
source_modules = ["comparo.core.configuration.v1alpha1"]
forbidden_modules = [
  "comparo.core.configuration.canonical",
  "comparo.core.configuration.compiler",
  "comparo.configuration",
]

[[tool.importlinter.contracts]]
name = "Deterministic planning must remain pure and adapter independent"
type = "forbidden"
source_modules = ["comparo.core.planning"]
forbidden_modules = [
  "comparo.configuration",
  "aiohttp",
  "asyncio",
  "httpcore",
  "httpx",
  "os",
  "pathlib",
  "random",
  "requests",
  "ruamel",
  "textual",
  "time",
  "typer",
  "urllib3",
  "yaml",
]

[[tool.importlinter.contracts]]
name = "Run-scoped resolution must use injected effects"
type = "forbidden"
source_modules = ["comparo.core.resolution"]
forbidden_modules = [
  "comparo.configuration",
  "aiohttp",
  "httpcore",
  "httpx",
  "os",
  "pathlib",
  "random",
  "requests",
  "ruamel",
  "secrets",
  "textual",
  "time",
  "typer",
  "urllib3",
  "yaml",
]

[[tool.importlinter.contracts]]
name = "The runtime must depend on ports instead of production or front-end adapters"
type = "forbidden"
source_modules = ["comparo.core.runtime"]
forbidden_modules = [
  "comparo.configuration",
  "aiohttp",
  "httpcore",
  "httpx",
  "os",
  "pathlib",
  "random",
  "requests",
  "ruamel",
  "textual",
  "time",
  "typer",
  "urllib3",
  "yaml",
]

# ── Release automation (Angular commits → semantic release) ──────────────────
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
build_command = "uv lock --upgrade-package comparo && git add uv.lock && uv build"
# Pre-1.0: keep every release in the 0.x line. allow_zero_version keeps 0.x
# versions (never forcing a 1.0.0 minimum), and major_on_zero = false means even
# a breaking change bumps the minor (0.x -> 0.(x+1)) instead of leaping to 1.0.0
# before we deliberately cut a stable release.
allow_zero_version = true
major_on_zero = false

# main cuts stable 0.x releases; alpha/beta/rc are the prerelease promotion
# tracks: 0.x.0-alpha.N -> -beta.N -> -rc.N -> stable.
[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.alpha]
match = "alpha"
prerelease = true
prerelease_token = "alpha"

[tool.semantic_release.branches.beta]
match = "beta"
prerelease = true
prerelease_token = "beta"

[tool.semantic_release.branches.rc]
match = "rc"
prerelease = true
prerelease_token = "rc"
