apiVersion: comparo/v1alpha1
kind: Project
metadata:
  id: tui-showcase
  name: TUI showcase
  description: Rich local catalog for exercising navigation, planning, execution, and reports.
  tags: [example, local, showcase]
spec:
  data: .comparo
  variables:
    client: comparo-tui
  defaults:
    subjects:
      - $use: Request/catalog
    baseline:
      $use: baseline
    candidates:
      - $use: candidate
    assertions:
      - $use: usable-response
    diffs:
      - $use: stable-status
    gate:
      $use: strict
    maximumAttempts: 1
    failFast: false
