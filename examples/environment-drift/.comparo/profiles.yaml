apiVersion: comparo/v1alpha1
kind: AssertionProfile
metadata:
  id: usable-response
  name: Usable JSON response
  description: Require HTTP 200 and a non-null decoded JSON body.
  tags: [assertion, json, blocking]
spec:
  rules:
    - id: status-is-200
      selector: response.status
      operator:
        name: equals
        expected: 200
      severity: blocking
      quantifier: one
      completeness: complete
    - id: body-is-present
      selector: response.body
      operator:
        name: notEquals
        expected: null
      severity: blocking
      quantifier: one
      completeness: complete
---
apiVersion: comparo/v1alpha1
kind: DiffProfile
metadata:
  id: stable-status
  name: Stable HTTP status
  description: Compare the status of every baseline and candidate response.
  tags: [diff, status, blocking]
spec:
  rules:
    - id: status-is-stable
      selector: response.status
      comparator:
        name: exact
      severity: blocking
      completeness: complete
---
apiVersion: comparo/v1alpha1
kind: DiffProfile
metadata:
  id: exact-body
  name: Exact JSON body
  description: Demonstrate strict body drift detection for selected Requests.
  tags: [diff, body, blocking]
spec:
  rules:
    - id: body-is-exact
      selector: response.body
      comparator:
        name: exact
      severity: blocking
      completeness: complete
---
apiVersion: comparo/v1alpha1
kind: DiffProfile
metadata:
  id: ignore-body
  name: Ignore JSON body
  description: Available as an explicit example of a non-blocking body comparison decision.
  tags: [diff, body, ignored]
spec:
  rules:
    - id: body-is-ignored
      selector: response.body
      comparator:
        name: ignore
      severity: warning
      completeness: complete
---
apiVersion: comparo/v1alpha1
kind: GateProfile
metadata:
  id: strict
  name: Strict release gate
  description: Fail the run when blocking assertions or diffs fail.
  tags: [gate, release, blocking]
spec: {}
